<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enilive SC Imst</title>
<meta name="theme-color" content="#007BA9">
<meta name="description" content="Für Mitglieder des SC Imst 1933: 2 Cent je Liter Treibstoff und 15 % auf Zubehör, Schmiermittel und Ersatzteile an der Enilive Station Venier Imst.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Enilive Station Venier Imst">
<meta property="og:title" content="Enilive VIP – Günstiger tanken in Imst">
<meta property="og:description" content="Für Mitglieder des SC Imst 1933: 2 Cent je Liter Treibstoff und 15 % auf Zubehör, Schmiermittel und Ersatzteile an der Enilive Station Venier Imst.">
<meta property="og:url" content="https://mathiasvenier.github.io/vip/sc/">
<meta property="og:image" content="https://mathiasvenier.github.io/vip/sc/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="de_AT">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Enilive VIP – Günstiger tanken in Imst">
<meta name="twitter:description" content="Für Mitglieder des SC Imst 1933: 2 Cent je Liter Treibstoff und 15 % auf Zubehör, Schmiermittel und Ersatzteile an der Enilive Station Venier Imst.">
<meta name="twitter:image" content="https://mathiasvenier.github.io/vip/sc/share.png">

<link rel="apple-touch-icon" href="icon-180.png">

<meta name="apple-mobile-web-app-title" content="Enilive SC">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="font/montserrat-700.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:'Montserrat';font-style:normal;font-weight:400;
    font-display:swap;src:url('font/montserrat-400.woff2') format('woff2');}@font-face{font-family:'Montserrat';font-style:normal;font-weight:700;
    font-display:swap;src:url('font/montserrat-700.woff2') format('woff2');}@font-face{font-family:'Montserrat';font-style:normal;font-weight:800;
    font-display:swap;src:url('font/montserrat-800.woff2') format('woff2');}
  :root{
    --green:#008582; --blue:#007BA9; --lightblue:#0DB4E6; --skyblue:#66D0EF; --ink:#0b3a52;
    --font:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--font); color:#fff;
    background:linear-gradient(45deg,var(--green) 0%,var(--blue) 52%,var(--lightblue) 100%);
    background-attachment:fixed;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    gap:clamp(12px,2.6vh,22px);
    padding:calc(env(safe-area-inset-top) + clamp(20px,3.8vh,34px)) 0
            calc(env(safe-area-inset-bottom) + clamp(16px,3vh,26px));
    overflow-x:hidden;
  }
  body::before{
    content:''; position:fixed; top:-30%; right:-25%;
    width:80vmax; height:80vmax;
    background:radial-gradient(circle,rgba(255,255,255,.14) 0%,transparent 62%);
    pointer-events:none;
  }
  .pad{padding-inline:clamp(20px,6vw,32px)}

  header{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
         animation:rise .55s cubic-bezier(.22,.7,.3,1) both}
  header img{width:clamp(56px,15vw,72px);height:auto;display:block}

  h1{font-size:clamp(19px,5vw,23px);font-weight:700;letter-spacing:.02em;line-height:1}

  .who{
    font-size:clamp(18px,4.9vw,21px);font-weight:700;
    letter-spacing:-.01em;line-height:1.32;margin-top:7px;
  }

  /* ---------- Codes ---------- */
  .deck{width:100%;animation:rise .55s cubic-bezier(.22,.7,.3,1) .08s both}
  .card{
    background:#fff;border-radius:20px;
    padding:clamp(13px,3.4vw,18px);
    box-shadow:0 20px 50px rgba(0,40,70,.30),0 5px 15px rgba(0,40,70,.16);
    text-align:center;
  }
  .card img{display:block;width:100%;height:auto;image-rendering:pixelated}


  /* Einzelcode */
  .solo{display:flex;justify-content:center}
  .solo .card{width:min(64vw,252px)}

  /* Gestapelte Codes */
  .track{
    display:flex;overflow-x:auto;
    scroll-snap-type:x mandatory;scrollbar-width:none;
    padding-inline:11%;gap:3%;
    -webkit-overflow-scrolling:touch;
  }
  .track::-webkit-scrollbar{display:none}
  .slide{
    flex:0 0 76%;scroll-snap-align:center;
    transform:scale(.88);opacity:.72;
    transition:transform .3s cubic-bezier(.22,.7,.3,1),opacity .3s ease;
  }
  .slide.on{transform:scale(1);opacity:1}

  .dots{display:flex;gap:7px;justify-content:center;margin-top:13px}
  .dots button{
    width:7px;height:7px;padding:0;border:0;border-radius:50%;
    background:rgba(255,255,255,.42);cursor:pointer;
    transition:background .2s,width .2s;
  }
  .dots button.on{background:#fff;width:19px;border-radius:4px}

  /* ---------- Vorteile ---------- */
  .perks{
    width:100%;display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;
    padding:12px 6px;border-radius:13px;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.26);
  }
  .perks.one{grid-template-columns:1fr;padding:11px 10px;margin-top:11px}
  .perks i{background:rgba(255,255,255,.3);height:74%;width:1px;display:block}
  .perks div{text-align:center;padding:0 8px}
  .perks strong{display:block;font-size:clamp(15px,4.2vw,18px);font-weight:800;line-height:1.05;letter-spacing:-.015em}
  .perks span{display:block;margin-top:3px;font-size:clamp(10.5px,2.9vw,12px);font-weight:400;
              color:rgba(255,255,255,.86);line-height:1.25}

  /* ---------- Fuß ---------- */
  .foot{width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center;
        gap:clamp(10px,2vh,15px);
        animation:rise .55s cubic-bezier(.22,.7,.3,1) .16s both}
  .station{text-align:center}
  .station b{
    display:block;font-size:clamp(18px,5vw,22px);font-weight:700;
    letter-spacing:-.015em;line-height:1.18;
  }
  .station span{
    display:block;margin-top:5px;
    font-size:clamp(15px,4.1vw,17px);font-weight:400;
    color:rgba(255,255,255,.9);
  }

  .notice{
    width:100%;display:flex;gap:8px;align-items:flex-start;
    padding:10px 14px;border-radius:11px;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);
    font-size:clamp(10.5px,2.9vw,11.5px);line-height:1.45;color:rgba(255,255,255,.92);
  }
  .notice svg{flex:none;width:15px;height:15px;margin-top:1px}

  .save{
    background:none;border:0;padding:2px;
    font-family:inherit;font-size:clamp(11.5px,3.1vw,12.5px);font-weight:700;
    color:rgba(255,255,255,.9);text-decoration:underline;text-underline-offset:3px;
    cursor:pointer;display:none;
  }
  .save.show{display:block}

  :focus-visible{outline:2.5px solid #fff;outline-offset:3px}

  /* ---------- Einladung ---------- */
  dialog{border:0;padding:0;background:transparent;max-width:100%;max-height:100%;color:#fff}
  dialog::backdrop{background:rgba(0,25,45,.66);backdrop-filter:blur(3px)}
  .sheet{
    width:min(90vw,390px);
    background:linear-gradient(150deg,var(--lightblue),var(--blue));
    border-radius:20px;padding:24px 22px 20px;
    box-shadow:0 30px 70px rgba(0,20,40,.5);font-family:var(--font);
    animation:pop .3s cubic-bezier(.22,.9,.3,1) both;
  }
  .sheet h2{font-size:17.5px;font-weight:700;margin-bottom:7px;line-height:1.25}
  .sheet .lead{font-size:13.5px;font-weight:400;color:rgba(255,255,255,.9);
               line-height:1.5;margin-bottom:18px}
  .sheet ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
  .sheet li{counter-increment:s;display:flex;gap:11px;align-items:center;font-size:13.5px;line-height:1.4}
  .sheet li::before{
    content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;
    background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:11.5px;font-weight:700;
  }
  .sheet li svg{width:16px;height:16px;vertical-align:-3px;margin:0 1px}
  .sheet .go{
    width:100%;padding:13px;border:0;border-radius:11px;background:#fff;color:var(--blue);
    font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
  }
  .sheet .later{
    width:100%;margin-top:9px;padding:7px;border:0;background:none;
    font-family:inherit;font-size:12.5px;font-weight:400;color:rgba(255,255,255,.72);cursor:pointer;
  }

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
  @media (max-height:700px){
    body{gap:clamp(8px,1.6vh,14px)}
    header img{width:46px}
    header{gap:7px}
    .target{padding:7px 15px;font-size:13.5px}
    .solo .card{width:min(50vw,186px)}
    .track{padding-inline:14%;gap:2.5%}
    .slide{flex-basis:70%}
    .card{padding:11px;border-radius:16px}
    h1{font-size:18px}
    .who{font-size:16.5px}
    .perks.one{margin-top:8px;padding:8px}
    .dots{margin-top:10px}
    .perks{padding:9px 4px}
    .station b{font-size:17px}
    .station span{font-size:14.5px}
    .notice{padding:8px 12px}
  }
</style>
</head>
<body>

  <header class="pad">
    <img src="mark.png" alt="Enilive">
    <h1>Enilive VIP</h1>
    <p class="who">für Mitglieder des<br>SC Imst 1933</p>
  </header>

  <div class="deck">
    <div class="track" id="track">

      <div class="slide on">
        <figure class="card"><img src="qr-sprit.png" alt="Code Treibstoff"></figure>
        <div class="perks one">
          <div><strong>2 Cent</strong><span>je Liter Treibstoff</span></div>
        </div>
      </div>

      <div class="slide">
        <figure class="card"><img src="qr-zubehoer.png" alt="Code Zubehör"></figure>
        <div class="perks one">
          <div><strong>15 %</strong><span>auf Zubehör, Schmiermittel und Ersatzteile</span></div>
        </div>
      </div>

    </div>
    <div class="dots" id="dots">
      <button type="button" class="on" aria-label="Treibstoff"></button>
      <button type="button" aria-label="Zubehör"></button>
    </div>
  </div>


  <div class="foot pad">


    <p class="station">
      <b>Enilive Station Venier Imst</b>
      <span>Bundesstraße 4 · 6460 Imst</span>
    </p>

    <p class="notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.6v.1"/>
      </svg>
      <span>Gültig ausschließlich an der Enilive Station Venier Imst. Das Angebot kann jederzeit enden.</span>
    </p>

    <button class="save" id="save" type="button">Am Handy speichern</button>
  </div>

  <dialog id="invite">
    <div class="sheet">
      <h2>Immer griffbereit</h2>
      <div id="sheet-body"></div>
      <button class="later" id="later" type="button">Später</button>
    </div>
  </dialog>

<script>
  /* --- Einladung zum Speichern --- */
  const dlg = document.getElementById('invite');
  const saveLink = document.getElementById('save');
  const installed = window.matchMedia('(display-mode: standalone)').matches
                 || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent)
             || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let prompt = null;

  const seen = () => { try { return localStorage.getItem('inviteSeen') === '1'; } catch(e) { return false; } };
  const mark = () => { try { localStorage.setItem('inviteSeen','1'); } catch(e) {} };

  function buildSheet(){
    const box = document.getElementById('sheet-body');
    if (prompt) {
      box.innerHTML = '<p class="lead">Ein Tipp genügt – der Code liegt danach als Symbol am Startbildschirm und funktioniert auch ohne Empfang.</p>'
                    + '<button class="go" id="go" type="button">Jetzt hinzufügen</button>';
      document.getElementById('go').onclick = async () => {
        dlg.close(); mark();
        prompt.prompt();
        const { outcome } = await prompt.userChoice;
        prompt = null;
        if (outcome === 'accepted') saveLink.classList.remove('show');
      };
    } else {
      box.innerHTML = '<p class="lead">So liegt der Code als Symbol am Startbildschirm – auch ohne Empfang abrufbar.</p>'
        + '<ol>'
        + '<li>Unten in Safari auf das Teilen-Symbol tippen'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg></li>'
        + '<li>Etwas nach unten wischen und \u201eZum Home-Bildschirm\u201c w\u00e4hlen</li>'
        + '<li>Rechts oben auf \u201eHinzuf\u00fcgen\u201c tippen \u2013 fertig</li>'
        + '</ol>'
        + '<button class="go" id="go" type="button">Verstanden</button>';
      document.getElementById('go').onclick = () => { dlg.close(); mark(); };
    }
  }

  function invite(){
    if (installed) return;
    buildSheet();
    if (!dlg.open) dlg.showModal();
  }

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); prompt = e;
    if (!installed) { saveLink.classList.add('show'); if (dlg.open) buildSheet(); }
  });

  if (!installed) {
    saveLink.classList.add('show');
    if (!seen()) setTimeout(invite, 900);
  }

  saveLink.onclick = invite;
  document.getElementById('later').onclick = () => { dlg.close(); mark(); };
  dlg.addEventListener('close', mark);
  window.addEventListener('appinstalled', () => saveLink.classList.remove('show'));

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }

  const track = document.getElementById('track');
  const slides = [...track.children];
  const dots = [...document.getElementById('dots').children];
  let ticking = false;
  function sync(){
    const mid = track.scrollLeft + track.clientWidth / 2;
    let best = 0, bestDist = Infinity;
    slides.forEach((s,n)=>{
      const d = Math.abs(s.offsetLeft + s.offsetWidth/2 - mid);
      if (d < bestDist) { bestDist = d; best = n; }
    });
    slides.forEach((s,n)=>s.classList.toggle('on', n===best));
    dots.forEach((d,n)=>d.classList.toggle('on', n===best));
  }
  track.addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(()=>{ sync(); ticking = false; });
  }, {passive:true});
  dots.forEach((d,i)=>d.onclick=()=>{
    slides[i].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  });
  sync();
</script>
</body>
</html>
